# svpwm_comm -- settings shared by both roles.
# The host (G474) and device (H743) builds each merge their role + board
# specific settings from boards/<board>.conf on top of this file.

CONFIG_MAIN_STACK_SIZE=8192

CONFIG_GPIO=y
CONFIG_SPI=y

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_MODE_DEFERRED=y

# spi_cmd.c/control.c log %f (freq/mag) on the host; cbprintf float support.
CONFIG_CBPRINTF_FP_SUPPORT=y

# Both boards have a hardware FPU (CONFIG_CPU_HAS_FPU=y) but it was left off,
# so control.c's SVPWM timer ISR (43.2 kHz) ran entirely in software float --
# measured as ~28 __aeabi_f* libcalls + 2 libm sinf calls, long enough to
# starve the USART ISR and drop received bytes (no ACK).
# Enabling the FPU also selects FP_HARDABI -> FPU_SHARING automatically.
CONFIG_FPU=y

# HMI comm subsystem (transport-agnostic core + UART backend). The actual
# UART is picked per board via the zephyr,comm chosen node in the overlays.
CONFIG_HMI_COMM=y
CONFIG_HMI_COMM_UART=y