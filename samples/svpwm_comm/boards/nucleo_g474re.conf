# svpwm_comm host role (NUCLEO-G474RE): SVPWM on TIM1 + SPI command link
# + comm host peer. No LVGL -- CONFIG_HMI stays off.
CONFIG_SVPWM_COMM_ROLE_HOST=y

# Console over ST-LINK VCP (LPUART1 on PA2/PA3)
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

# PWM driver so the pwm1 pinctrl in the overlay muxes the TIM1 output pins
# (PA8..PA12/PB15 -> TIM1 alternate function); without it no PWM reaches
# the pins even though TIM1 runs.
CONFIG_PWM=y

# User button B1 (PC13, active low) drives the gauge: every press sends one
# SET_GAUGE. The gpio-keys node is already in the board DTS and
# CONFIG_INPUT_GPIO_KEYS defaults to y, so CONFIG_INPUT is the only switch.
CONFIG_INPUT=y
