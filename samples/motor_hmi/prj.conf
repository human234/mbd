# App-side settings the HMI library needs
CONFIG_MAIN_STACK_SIZE=8192

CONFIG_GPIO=y
CONFIG_SPI=y

# SPI1 LCD bus moves ~14 KB per flush; DMA frees the flush thread from
# byte-pumping so main can render while the transfer runs. DMA_STM32_V2
# and DMAMUX_STM32 enable themselves from the DT nodes in the overlay.
CONFIG_DMA=y
CONFIG_SPI_STM32_DMA=y

CONFIG_LOG=y

# Resistive touch (XPT2046 on SPI3, 'zephyr,touch' chosen) -> LVGL pointer
# Upstream xptek,xpt2046 driver (CONFIG_INPUT_XPT2046).
CONFIG_INPUT=y
CONFIG_INPUT_XPT2046=y
# The input module logs a "Timeout discarded" DBG line on EVERY syswq report,
# and with CONFIG_INPUT_LOG_LEVEL_DBG the resulting flood overflows the
# deferred log queue at 115200 baud (seen as "--- N messages dropped ---").
# Keep WRN so the "Event dropped, queue full" canary stays visible.
CONFIG_INPUT_LOG_LEVEL_WRN=y
# Input pipeline must never be starved, or the 16-slot event msgq fills and
# every touch is dropped before reaching LVGL ("Event dropped, queue full,
# not blocking in syswq"). Run the input thread at cooperative top priority
# (preempts the flush thread) and give it headroom for bursts/drags.
CONFIG_INPUT_THREAD_PRIORITY_OVERRIDE=y
CONFIG_INPUT_THREAD_PRIORITY=-1
CONFIG_INPUT_THREAD_STACK_SIZE=2048
CONFIG_INPUT_QUEUE_MAX_MSGS=64
CONFIG_LV_Z_POINTER_INPUT=y
CONFIG_LV_Z_POINTER_FROM_CHOSEN_TOUCH=y

# Display driver stack (ILI9488 over 4-wire MIPI DBI/SPI)
CONFIG_DISPLAY=y
CONFIG_DISPLAY_LOG_LEVEL_ERR=y

# LVGL, rendering natively in the panel's 18-bit RGB666 mode.
# The HMI module (CONFIG_HMI) selects the widgets and fonts it needs;
# the display-specific settings stay here.
CONFIG_LVGL=y
CONFIG_LV_COLOR_DEPTH_24=y
# VDB size in % of the framebuffer. Landscape and portrait are the same
# 153600 px, so 3% = 4608 px = 13824 bytes @ RGB888 -- identical to the
# portrait display_demo and known to fit next to the widget set in the
# LVGL memory pool.
CONFIG_LV_Z_VDB_SIZE=3
# Double the draw buffer and flush in a dedicated thread so the next strip
# can be rendered while the previous one is still being pushed over SPI.
# Flush thread priority MUST stay below the input/sysworkq threads (-1), or
# a long synchronous flush starves XPT2046 sampling (the old touch freeze).
CONFIG_LV_Z_DOUBLE_VDB=y
CONFIG_LV_Z_FLUSH_THREAD=y
CONFIG_LV_Z_FLUSH_THREAD_PRIORITY=4
CONFIG_LV_Z_FLUSH_THREAD_STACK_SIZE=1024
# LVGL pool holds the object set + the rendering buffer for the app's
# lifetime (lv_malloc in lvgl.c).
CONFIG_LV_Z_MEM_POOL_SIZE=80000
CONFIG_LV_USE_LOG=y
CONFIG_LV_LOG_LEVEL_ERROR=y

# HMI library
CONFIG_HMI=y

# Flash is at 100%: trim LVGL down to just the widgets the HMI demo uses
# (ARC/ARCLABEL/BAR/BUTTON/BUTTONMATRIX/CHART/IMAGE/LABEL/LINE/SLIDER/
# TABVIEW + FLEX layout). LTO is unavailable here: GEN_ISR_TABLES forces
# CONFIG_LTO back to n on this board.
CONFIG_LV_USE_TABLE=n
CONFIG_LV_USE_TEXTAREA=n
CONFIG_LV_USE_ROLLER=n
CONFIG_LV_USE_SPINBOX=n
CONFIG_LV_USE_SPINNER=n
CONFIG_LV_USE_SWITCH=n
CONFIG_LV_USE_CHECKBOX=n
CONFIG_LV_USE_DROPDOWN=n
CONFIG_LV_USE_CALENDAR=n
CONFIG_LV_USE_KEYBOARD=n
CONFIG_LV_USE_MSGBOX=n
CONFIG_LV_USE_MENU=n
CONFIG_LV_USE_TILEVIEW=n
CONFIG_LV_USE_WIN=n
CONFIG_LV_USE_LIST=n
CONFIG_LV_USE_ANIMIMG=n
CONFIG_LV_USE_CANVAS=n
CONFIG_LV_USE_IMAGEBUTTON=n
CONFIG_LV_USE_SPAN=n
CONFIG_LV_USE_SCALE=n
CONFIG_LV_USE_LED=n
CONFIG_LV_USE_GIF=n

# add picolib float support
CONFIG_PICOLIBC_IO_FLOAT=y
