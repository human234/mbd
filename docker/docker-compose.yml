# One-command build for the HMI gauge demo using the self-contained HMI image
# (official Zephyr ci-base container + ARM-only Zephyr SDK + baked west
# workspace at /workdir + STM32CubeProgrammer CLI). No workspace mount is
# needed: the image already contains the workspace snapshot; re-bake and
# rebuild it after source changes (docker/rebake-workspace.sh -> make image).
#
# Usage (from anywhere):
#   docker compose -f modules/hmi/docker/docker-compose.yml run --rm hmi
#   docker compose -f modules/hmi/docker/docker-compose.yml run --rm hmi-flash
# Rebuild locally when needed (build context = this repo root):
#   docker build --build-context sdk-src=... --build-context ws-src=... \
#     -f docker/Dockerfile -t ghcr.io/human234/hmi-build:0.2.0 .
services:
  hmi:
    image: ghcr.io/human234/hmi-build:0.2.0
    working_dir: /workdir
    init: true
    command:
      - west
      - build
      - -b
      - nucleo_g474re
      - -p
      - always
      - modules/hmi/samples/gauge_demo

  hmi-flash:
    image: ghcr.io/human234/hmi-build:0.2.0
    working_dir: /workdir
    init: true
    privileged: true
    command:
      - sh
      - -lc
      - west build -b nucleo_g474re -p always modules/hmi/samples/gauge_demo && west flash